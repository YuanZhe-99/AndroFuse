<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse V3 · 搜索</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="stagehead"><a href="index.html">← 目录</a><b>搜索（Ctrl K）</b><span class="sp"></span><button data-theme-toggle>浅色 / 深色</button></div>
<div class="artboards">
<div>
<p class="cap"><b>Ctrl K 或侧栏底部的放大镜</b>（Kyokai 式）：按组列出已打开的画面、手机、应用、操作和设置，每组最多六条；输入的词都要出现在标题或说明里。↑ ↓ 选择，Enter 打开，Esc 关闭。画面窗格有键盘焦点时，Ctrl K 交给手机。</p>
<div class="win">
  <aside class="side">
    <div class="side-top"><button class="ib"><i data-i="sidebar"></i></button><span class="sp"></span><button class="ib"><i data-i="plus"></i></button></div>
    <div class="nav on"><span class="mark"></span><span class="t">主页</span></div>
    <div class="side-scroll"></div>
    <div class="side-foot"><div class="netstate"><span class="dot ok"></span><span class="ell">跨网络 · 已连接</span></div><button class="ib on"><i data-i="search"></i></button><button class="ib"><i data-i="auto"></i></button><button class="ib"><i data-i="gear"></i></button></div>
  </aside>
  <main class="panes"><section class="pane"><header class="ph"><div class="who"><i data-i="home"></i><div class="names"><div class="n1">主页</div></div></div><span class="grow"></span><div class="winbtns"><span><i data-i="min" class="s"></i></span><span><i data-i="max" class="s"></i></span><span class="x"><i data-i="close" class="s"></i></span></div></header><div class="pbody"></div></section></main>
  <div class="scrim" style="background:rgba(0,0,0,.12)"></div>
  <div class="palette">
    <div class="pal-in"><i data-i="search"></i><span><mark>微</mark>|</span><span class="sp" style="flex:1"></span><span class="kbd">Esc</span></div>
    <div class="pal-b">
      <div class="mlabel">已打开</div>
      <div class="mi hl"><span class="appdot" style="width:16px;height:16px;border-radius:4px;background:#07c160"></span><span class="t"><mark>微</mark>信<span class="t2">我的折叠屏 · 应用窗口</span></span><span class="kbd">Enter</span></div>
      <div class="mlabel">应用</div>
      <div class="mi"><span style="width:16px;height:16px;border-radius:4px;background:#07c160"></span><span class="t"><mark>微</mark>信<span class="t2">在 Pixel 8 Pro 上打开</span></span></div>
      <div class="mi"><span style="width:16px;height:16px;border-radius:4px;background:#ff8200"></span><span class="t"><mark>微</mark>博<span class="t2">在 我的折叠屏 上打开</span></span></div>
      <div class="mlabel">操作</div>
      <div class="mi"><i data-i="clip" class="s"></i><span class="t">发送剪贴板到 我的折叠屏<span class="t2">剪贴板里有「<mark>微</mark>信号 zhangsan」</span></span></div>
    </div>
  </div>
</div>
</div>
</div>
<script src="logos.js"></script>
<script src="common.js"></script>
</body>
</html>
