<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse 手机端 · 安全</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="artboard">
<div class="phone-bezel">
  <div id="mob-root" class="mob">
    <header class="mob-topbar">
      <h1>安全</h1>
      <button class="ib" type="button" onclick="toggleTheme()" title="切换深浅色"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4"/></svg></button>
    </header>

    <div class="mob-scroll">
      <section class="mob-card">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="mob-ico sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h.01"/><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.8a10 10 0 0 1 14 0"/></svg></span>
          <div><b style="font-size:15px">跨网无线端口</b><div class="hint">在系统“无线调试”页可以看到</div></div>
        </div>
        <div class="field">
          <label for="adb-port">无线调试端口</label>
          <div class="affix"><span class="pre">192.168.1.40:</span><input id="adb-port" class="num" inputmode="numeric" value="41235" placeholder="41235" data-validate="port"></div>
          <span class="err" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>端口应在 1024–65535 之间</span>
        </div>
        <button class="btn pri" style="width:100%" type="button" data-loading="1200">保存并同步</button>
      </section>

      <section class="mob-card">
        <details class="disc" open>
          <summary style="font-size:14px;color:var(--tx)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            安全校验指纹
          </summary>
          <div class="disc-body">
            <div class="mono" style="font-size:12px;padding:10px;border-radius:var(--r-lg);background:var(--soft);border:1px solid var(--border);letter-spacing:0.02em">SHA256: 9F:<wbr>4C:<wbr>12:<wbr>8A:<wbr>E7:<wbr>03:<wbr>5B:<wbr>90:<wbr>1A:<wbr>D4:<wbr>77:<wbr>C8:<wbr>31:<wbr>6E:<wbr>09:<wbr>B2</div>
            <span class="hint">与电脑端连接时显示的指纹逐段一致即可</span>
            <button class="btn sm" style="align-self:flex-start" type="button">复制指纹</button>
          </div>
        </details>
      </section>

      <section class="mob-card rows">
        <div class="mob-sec">最近记录</div>
        <div class="mob-row" style="min-height:52px">
          <span class="mob-ico sm"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4.5 4.5L19 7"/></svg></span>
          <div class="t"><b>电脑端已连接</b><time>22:08</time></div>
        </div>
        <div class="mob-row" style="min-height:52px">
          <span class="mob-ico sm neutral"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></span>
          <div class="t"><b>收到文件（1 份）</b><time>21:40 · 已存下载目录</time></div>
        </div>
      </section>
    </div>

    <nav class="mob-nav" aria-label="手机导航">
      <a class="mob-tab" href="MobileHome.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>主页</span></a>
      <a class="mob-tab" href="MobilePermissions.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>权限</span></a>
      <a class="mob-tab cur" href="MobileSecurity.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>安全</span></a>
    </nav>
  </div>
</div>
<script>
function toggleTheme() {
  document.getElementById('mob-root').classList.toggle('dark');
  document.body.classList.toggle('dark-board');
}
</script>
<script src="common.js"></script>
</body>
</html>
