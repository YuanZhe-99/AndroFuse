<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse 手机端 · 主页</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="artboard">
<div class="phone-bezel">
  <div id="mob-root" class="mob">
    <header class="mob-topbar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <svg width="26" height="26" viewBox="0 0 96 96" aria-hidden="true" style="flex-shrink:0"><rect width="96" height="96" rx="18" fill="#1D2C33"/><rect x="31.75" y="31.75" width="32.5" height="32.5" rx="5.3" fill="none" stroke="#B8F1D2" stroke-width="4"/><g fill="#B8F1D2"><circle cx="40" cy="48" r="2"/><circle cx="48" cy="48" r="2"/><circle cx="56" cy="48" r="2"/><rect x="38" y="54" width="4" height="4" rx="1"/><rect x="46" y="54" width="4" height="4" rx="1"/><rect x="54" y="54" width="4" height="4" rx="1"/></g></svg>
        <h1>AndroFuse</h1>
      </div>
      <button class="ib" type="button" onclick="toggleTheme()" title="切换深浅色"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </header>

    <div class="mob-scroll">
      <section class="mob-hero">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:13px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 4.5 4.5L19 7"/></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:16px;font-weight:700;color:var(--tint-tx)">协同服务已开启</div>
            <div style="font-size:12px;color:var(--tx2)">已加密 · 等待电脑连接</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" style="flex:1" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>停止服务</button>
          <a class="btn soft" href="MobileFoldAndNarrow.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>折叠屏</a>
        </div>
      </section>

      <section class="mob-card">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="mob-ico sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <b style="font-size:15px">配对码</b>
          <span class="chip ok" style="margin-left:auto">加密</span>
        </div>
        <div class="code-box">
          <span class="code-digits">849 216</span>
          <div style="display:flex;gap:6px">
            <button class="btn sm" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>复制</button>
            <button class="btn sm soft" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>换码</button>
          </div>
        </div>
        <span class="mono hint">192.168.1.40:38412</span>
      </section>

      <section class="mob-card rows">
        <a class="mob-row" href="MobilePermissions.html">
          <span class="mob-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
          <div class="t"><b>开放给电脑的权限</b><span>已开 3 项 · 音频传入默认关闭</span></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </a>
        <a class="mob-row" href="MobileSecurity.html">
          <span class="mob-ico neutral"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h.01"/><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.8a10 10 0 0 1 14 0"/></svg></span>
          <div class="t"><b>跨网助手与操作记录</b><span>无线端口 · 加密指纹核对</span></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </section>
    </div>

    <nav class="mob-nav" aria-label="手机导航">
      <a class="mob-tab cur" href="MobileHome.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>主页</span></a>
      <a class="mob-tab" href="MobilePermissions.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>权限</span></a>
      <a class="mob-tab" href="MobileSecurity.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>安全</span></a>
    </nav>
  </div>
</div>
<script>
function toggleTheme() {
  document.getElementById('mob-root').classList.toggle('dark');
  document.body.classList.toggle('dark-board');
}
</script>
<script src="common.js"></script>
</body>
</html>
