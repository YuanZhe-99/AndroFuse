<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse 手机端 · 权限</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="artboard">
<div class="phone-bezel">
  <div id="mob-root" class="mob">
    <header class="mob-topbar">
      <h1>权限</h1>
      <button class="ib" type="button" onclick="toggleTheme()" title="切换深浅色"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4"/></svg></button>
    </header>

    <div class="mob-scroll">
      <section class="mob-card rows">
        <div class="mob-sec">日常协同</div>
        <div class="mob-row">
          <span class="mob-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2"/></svg></span>
          <div class="t"><b>电量与网络状态</b><span>显示手机电量和温度</span></div>
          <button class="sw on" type="button" aria-label="电量状态"></button>
        </div>
        <div class="mob-row">
          <span class="mob-ico neutral"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></span>
          <div class="t"><b>剪贴板同步</b><span>双向分享复制内容</span></div>
          <button class="sw" type="button" aria-label="剪贴板"></button>
        </div>
        <div class="mob-row">
          <span class="mob-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
          <div class="t"><b>通知与回复</b><span>在电脑查看并回复消息</span></div>
          <button class="sw on" type="button" aria-label="通知"></button>
        </div>
        <div class="mob-row">
          <span class="mob-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></span>
          <div class="t"><b>接收电脑文件</b><span>仅存入授权下载目录</span></div>
          <button class="sw on" type="button" aria-label="文件接收"></button>
        </div>
        <div class="mob-row">
          <span class="mob-ico neutral"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          <div class="t"><b>应用接力</b><span>在电脑接续打开当前应用</span></div>
          <button class="sw" type="button" aria-label="应用接力"></button>
        </div>
      </section>

      <section class="mob-card rows">
        <div class="mob-sec">画面与安全</div>
        <div class="mob-row">
          <span class="mob-ico warn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></span>
          <div class="t"><b>接收电脑麦克风 <span class="chip warn xs">默认关</span></b><span>允许电脑声音传入手机</span></div>
          <button class="sw" type="button" aria-label="麦克风传入"></button>
        </div>
        <div class="mob-row">
          <span class="mob-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10"/></svg></span>
          <div class="t"><b>清理异常虚拟屏</b><span>断连后恢复手机显示</span></div>
          <button class="sw on" type="button" aria-label="清理屏幕"></button>
        </div>
        <div class="mob-row">
          <span class="mob-ico warn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg></span>
          <div class="t"><b>跨网端口助手 <span class="chip warn xs">默认关</span></b><span>异网帮助电脑找到此手机</span></div>
          <button class="sw" type="button" aria-label="跨网端口"></button>
        </div>
      </section>
    </div>

    <nav class="mob-nav" aria-label="手机导航">
      <a class="mob-tab" href="MobileHome.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>主页</span></a>
      <a class="mob-tab cur" href="MobilePermissions.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>权限</span></a>
      <a class="mob-tab" href="MobileSecurity.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>安全</span></a>
    </nav>
  </div>
</div>
<script>
function toggleTheme() {
  document.getElementById('mob-root').classList.toggle('dark');
  document.body.classList.toggle('dark-board');
}
</script>
<script src="common.js"></script>
</body>
</html>
