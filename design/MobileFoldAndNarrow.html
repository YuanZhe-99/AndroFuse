<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse 手机端 · 折叠屏双栏与极窄外屏</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="artboard" style="align-items:stretch">
<div style="max-width:1180px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start">
  <!-- Fold 8 Unfolded (704x800, 2-col) -->
  <div class="phone-bezel" style="border-radius:28px">
    <div class="mob unfolded">
      <header class="mob-topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <svg width="26" height="26" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="18" fill="#1D2C33"/><rect x="31.75" y="31.75" width="32.5" height="32.5" rx="5.3" fill="none" stroke="#B8F1D2" stroke-width="4"/></svg>
          <h1>AndroFuse · Fold 展开双栏</h1>
        </div>
        <a class="btn sm" href="MobileHome.html">返回手机视图</a>
      </header>

      <div class="mob-scroll">
        <div class="mob-grid-2">
          <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
            <section class="mob-hero">
              <div style="display:flex;align-items:center;gap:10px">
                <span style="width:36px;height:36px;border-radius:11px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 4.5 4.5L19 7"/></svg></span>
                <div><b style="color:var(--tint-tx)">协同服务已开启</b><div style="font-size:12px;color:var(--tx2)">等待电脑连接</div></div>
              </div>
              <button class="btn" type="button">停止服务</button>
            </section>
            <section class="mob-card">
              <b style="font-size:15px">配对码</b>
              <div class="code-box"><span class="code-digits">849 216</span><button class="btn sm" type="button">复制</button></div>
              <span class="mono hint">192.168.1.40:38412</span>
            </section>
          </div>

          <section class="mob-card rows">
            <div class="mob-sec">快捷授权</div>
            <div class="mob-row"><span class="mob-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="16" height="10" rx="2"/></svg></span><div class="t"><b>电量与状态</b><span>显示手机电量</span></div><button class="sw on" type="button"></button></div>
            <div class="mob-row"><span class="mob-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></span><div class="t"><b>通知回复</b><span>电脑端回消息</span></div><button class="sw on" type="button"></button></div>
            <div class="mob-row"><span class="mob-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg></span><div class="t"><b>接收文件</b><span>存至下载目录</span></div><button class="sw on" type="button"></button></div>
            <div class="mob-row"><span class="mob-ico warn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/></svg></span><div class="t"><b>电脑麦克风</b><span>默认关闭</span></div><button class="sw" type="button"></button></div>
          </section>
        </div>
      </div>

      <nav class="mob-nav" aria-label="手机导航">
        <a class="mob-tab cur" href="MobileHome.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>主页</span></a>
        <a class="mob-tab" href="MobilePermissions.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>权限</span></a>
        <a class="mob-tab" href="MobileSecurity.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>安全</span></a>
      </nav>
    </div>
  </div>

  <!-- Narrow Cover Screen (340x740) -->
  <div class="phone-bezel">
    <div class="mob narrow-fold">
      <header class="mob-topbar">
        <h1>外屏 340dp</h1>
        <span class="chip ok">无重叠</span>
      </header>
      <div class="mob-scroll">
        <section class="mob-hero">
          <b style="color:var(--tint-tx)">已加密运行</b>
          <span class="hint">无固定列宽，极窄屏不挤压</span>
        </section>
        <section class="mob-card">
          <b style="font-size:15px">配对码</b>
          <div class="code-box"><span class="code-digits" style="font-size:20px">849 216</span><button class="btn sm" type="button">复制</button></div>
          <span class="mono hint">192.168.1.40:38412</span>
        </section>
        <section class="mob-card rows">
          <div class="mob-row"><span class="mob-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="16" height="10" rx="2"/></svg></span><div class="t"><b>电量与状态</b><span>显示手机电量</span></div><button class="sw on" type="button"></button></div>
          <div class="mob-row"><span class="mob-ico warn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/></svg></span><div class="t"><b>电脑麦克风</b><span>默认关闭</span></div><button class="sw" type="button"></button></div>
        </section>
      </div>
      <nav class="mob-nav" aria-label="手机导航">
        <a class="mob-tab cur" href="MobileHome.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>主页</span></a>
        <a class="mob-tab" href="MobilePermissions.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>权限</span></a>
        <a class="mob-tab" href="MobileSecurity.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>安全</span></a>
      </nav>
    </div>
  </div>
</div>
<script src="common.js"></script>
</body>
</html>
