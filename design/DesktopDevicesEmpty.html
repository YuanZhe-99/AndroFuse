<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse · 未连接引导</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="artboard">
<div class="win keep-full">
  <div class="shell">
    <nav class="side" aria-label="侧边栏">
      <div class="side-top">
        <a class="ib" href="DesktopDevicesNarrow.html" title="折叠侧边栏"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></a>
        <a class="cta-connect" href="DesktopConnectDialog.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span>连接设备</span></a>
      </div>
      <a class="cmdk" href="DesktopCommandPalette.html" title="搜索或执行命令 (Ctrl K)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="lbl">搜索或执行…</span><span class="kbd"><kbd>Ctrl</kbd><kbd>K</kbd></span></a>
      <a class="nav-item cur" href="DesktopDevicesEmpty.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2"/></svg><span class="lbl">设备</span><span class="cnt"></span></a>
      <a class="nav-item" href="DesktopApps.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">应用</span></a>
      <a class="nav-item" href="DesktopCompanion.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 7h8a4 4 0 0 1 0 8H8a4 4 0 0 1 0-8Z"/></svg><span class="lbl">协同</span></a>
      <div style="flex:1"></div>
      <a class="nav-item" href="DesktopSettings.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/></svg><span class="lbl">设置</span></a>
      <a class="side-status" href="DesktopDiagnostics.html"><span class="dot"></span><span class="t"><b>本机准备就绪</b><i>硬件加速可用</i></span></a>
    </nav>

    <div class="prow">
      <main class="pane">
        <header class="pane-head">
          <svg width="20" height="20" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="18" fill="#1D2C33"/><rect x="31.75" y="31.75" width="32.5" height="32.5" rx="5.3" fill="none" stroke="#B8F1D2" stroke-width="4"/></svg>
          <span class="ph-title"><b>设备</b></span>
          <div class="wb">
            <button aria-label="最小化"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
            <button aria-label="最大化"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
            <button class="wclose" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
          </div>
        </header>

        <div class="pane-scroll">
          <div class="pane-inner">
            <section class="card" style="align-items:center;text-align:center;padding:32px 20px;gap:10px">
              <span class="tile-ico xl"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/></svg></span>
              <h1 style="margin:2px 0 0;font-size:20px">连接一台手机或平板</h1>
              <span class="prose" style="font-size:13px;color:var(--tx2);max-width:36ch">连上后可在电脑上使用三星 DeX、手机镜像和独立应用窗口。</span>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
                <a class="btn pri" href="DesktopConnectDialog.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>无线配对</a>
                <a class="btn" href="DesktopDevices.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>重新扫描</a>
              </div>
            </section>

            <div class="grid-3">
              <a class="card" href="DesktopDevices.html">
                <span class="tile-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg></span>
                <b style="font-size:14px">数据线直连</b>
                <span class="hint">插线并授权，延迟最低</span>
              </a>
              <a class="card" href="DesktopConnectDialog.html">
                <span class="tile-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h.01"/><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.8a10 10 0 0 1 14 0"/></svg></span>
                <b style="font-size:14px">加密无线连接</b>
                <span class="hint">输入一次 6 位码即可记住</span>
              </a>
              <a class="card" href="DesktopSettings.html">
                <span class="tile-ico neutral"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10"/></svg></span>
                <b style="font-size:14px">本地环境</b>
                <span class="hint">免手机直接运行应用</span>
              </a>
            </div>

    </div>
  </div>
</div>
<script src="common.js"></script>
</body>
</html>
