<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AndroFuse UI 重新设计草稿总览</title>
<style>
:root { --bg:#EEF2F5; --surface:#FFFFFF; --ink:#1B1D21; --ink2:#4A5260; --line:#DCE2E8; --acc:#146C4B; --tint:#E3F5ED; --tint-tx:#0D4E35; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14171B; --surface:#20242B; --ink:#EDEFF2; --ink2:#A9AFBA; --line:#323741; --acc:#5CD6A0; --tint:#16382B; --tint-tx:#A6F0CE; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif; }
header, main { max-width:1420px; margin:0 auto; padding:0 24px; }
header { padding-top:26px; padding-bottom:14px; }
h1 { margin:0 0 6px; font-size:24px; font-weight:700; }
header p { margin:0; color:var(--ink2); font-size:13px; max-width:78ch; line-height:1.55; }
main { padding-bottom:44px; display:flex; flex-direction:column; gap:28px; }
section h2 { margin:0 0 12px; font-size:16px; font-weight:700; display:flex; align-items:center; gap:10px; }
.badge { font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; background:var(--tint); color:var(--tint-tx); }
.row { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; }
figure { margin:0; display:flex; flex-direction:column; gap:7px; min-width:0; }
.frame { position:relative; overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); box-shadow:0 4px 14px rgba(15,22,32,0.08); }
.frame iframe { position:absolute; left:0; top:0; border:0; transform-origin:0 0; }
figcaption { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--ink2); }
figcaption strong { color:var(--ink); font-weight:600; }
figcaption a { color:var(--acc); text-decoration:none; font-weight:600; white-space:nowrap; }
figcaption a:hover { text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>AndroFuse UI 重新设计草稿 V2.1（主窗口内嵌窗格 + 精简图标化 + 设计词汇规范）</h1>
  <p>参考 Kyokai 与 Windows-ARM64.apk：投屏、三星 DeX 与独立应用默认在主窗口内以窗格打开并支持分屏，可随时点 ↗ 弹出为独立窗口或点 ◧ 放回主窗口；全界面采用图标引导并精简说明文字。V2.1 按 topinspo.design/vocabulary 统一了圆角、细线、分层阴影、三级文字色、等宽数字、动效曲线与按钮层级，并新增命令面板与交互状态规范两张画板（对照表见 README）。点“打开原图”可全尺寸预览。</p>
</header>
<main id="gallery"></main>
<script>
const sections = [
  {
    title: '电脑端（主窗口窗格、分屏、独立窗口与设置）',
    badge: '14 张画板 · 最低宽度 820px',
    boards: [
      { file: 'DesktopDevices.html', title: '设备主页（分屏按钮 + 已记住设备）', w: 1280, h: 800 },
      { file: 'DesktopOpenMenu.html', title: '打开方式下拉菜单', w: 1280, h: 800 },
      { file: 'DesktopPaneDeX.html', title: '主窗口内嵌 DeX（深色）', w: 1280, h: 800 },
      { file: 'DesktopPaneSplit.html', title: '主窗口双窗格分屏 + ⋯ 收纳', w: 1280, h: 800 },
      { file: 'DesktopStandalone.html', title: '独立窗口（含放回主窗口）', w: 1280, h: 800 },
      { file: 'DesktopDevicesNarrow.html', title: '820px 最小宽度（64px 图标栏）', w: 820, h: 600 },
      { file: 'DesktopDevicesEmpty.html', title: '未连接引导', w: 1280, h: 800 },
      { file: 'DesktopApps.html', title: '应用启动器', w: 1280, h: 800 },
      { file: 'DesktopCompanion.html', title: '手机协同（含一键装伴侣）', w: 1280, h: 800 },
      { file: 'DesktopConnectDialog.html', title: '连接与可选安装伴侣 APK', w: 1280, h: 800 },
      { file: 'DesktopSettings.html', title: '设置（主窗口窗格 + 面包屑）', w: 1280, h: 800 },
      { file: 'DesktopDiagnostics.html', title: '本机诊断（Bento 实测面板）', w: 1280, h: 800 },
      { file: 'DesktopCommandPalette.html', title: '命令面板（Ctrl K）', w: 1280, h: 800 },
      { file: 'DesktopStates.html', title: '交互状态规范（设计词汇）', w: 1280, h: 900 },
    ]
  },
  {
    title: '手机端（Android 伴侣 · 常规、折叠屏与 340dp 外屏）',
    badge: '4 张画板 · 最低 320dp',
    boards: [
      { file: 'MobileHome.html', title: '伴侣主页', w: 410, h: 820 },
      { file: 'MobilePermissions.html', title: '功能权限（图标行）', w: 410, h: 820 },
      { file: 'MobileSecurity.html', title: '安全与最近记录', w: 410, h: 820 },
      { file: 'MobileFoldAndNarrow.html', title: 'Fold 8 双栏 (704dp) + 340dp 外屏', w: 1120, h: 820 },
    ]
  }
];

const root = document.getElementById('gallery');
for (const sec of sections) {
  const el = document.createElement('section');
  const h2 = document.createElement('h2');
  h2.innerHTML = `${sec.title}<span class="badge">${sec.badge}</span>`;
  const row = document.createElement('div');
  row.className = 'row';

  for (const b of sec.boards) {
    const scale = b.w > 900 ? 0.35 : 0.60;
    const fig = document.createElement('figure');
    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.style.width = Math.round(b.w * scale) + 'px';
    frame.style.height = Math.round(b.h * scale) + 'px';

    const iframe = document.createElement('iframe');
    iframe.src = b.file;
    iframe.title = b.title;
    iframe.loading = 'lazy';
    iframe.width = b.w;
    iframe.height = b.h;
    iframe.style.transform = `scale(${scale})`;
    frame.appendChild(iframe);

    const cap = document.createElement('figcaption');
    const lbl = document.createElement('span');
    lbl.innerHTML = `<strong>${b.title}</strong> · ${b.w}×${b.h}`;
    const link = document.createElement('a');
    link.href = b.file;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = '打开 ↗';
    cap.append(lbl, link);

    fig.append(frame, cap);
    row.appendChild(fig);
  }
  el.append(h2, row);
  root.appendChild(el);
}
</script>
</body>
</html>
