<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse · 连接设备</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="artboard">
<div class="win keep-full">
  <div class="shell" aria-hidden="true">
    <nav class="side"><span class="cta-connect"><span>连接设备</span></span><span class="nav-item cur"><span class="lbl">设备</span></span></nav>
    <main class="pane"></main>
  </div>

  <div class="scrim">
    <section class="dialog" role="dialog" aria-labelledby="dlg-title">
      <header class="sheet-head">
        <span class="tile-ico sm"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h.01"/><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.8a10 10 0 0 1 14 0"/></svg></span>
        <h2 id="dlg-title">连接设备</h2>
        <div class="tabs" role="tablist" style="height:50px;margin-left:10px">
          <button id="tab-phone" class="active" type="button" role="tab" aria-selected="true" onclick="switchTab('phone')">无线手机</button>
          <button id="tab-comp" type="button" role="tab" aria-selected="false" onclick="switchTab('comp')">手机伴侣</button>
        </div>
        <span class="grow"></span>
        <a class="ib" href="DesktopDevices.html" title="关闭"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6"/></svg></a>
      </header>

      <div id="panel-phone" class="dialog-body">
        <div class="list">
          <div class="lr">
            <span class="tile-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
            <span class="t"><b>Galaxy Z Fold 8 <span class="chip info">已记住</span></b><span>今天 21:40 连过 · 免配对码</span></span>
            <a class="btn sm" href="DesktopDevices.html" data-loading="1000">立即重连</a>
          </div>
          <div class="lr">
            <span class="tile-ico neutral"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2"/></svg></span>
            <span class="t"><b>等待配对的新手机</b><span>192.168.1.58:37819</span></span>
            <button class="btn sm" type="button">填入配对</button>
          </div>
        </div>

        <section class="card soft">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <b style="font-size:14px">首次无线配对</b>
            <span class="chip ok">加密连接</span>
          </div>
          <div class="field-grid">
            <div class="field"><label for="pair-addr">配对地址</label><input id="pair-addr" class="input num" value="192.168.1.58:37819"></div>
            <div class="field"><label for="pair-code">6 位配对码</label><input id="pair-code" class="input num" inputmode="numeric" maxlength="7" placeholder="手机显示的 6 位数字" data-validate="digits6" aria-describedby="pair-code-err"><span id="pair-code-err" class="err" role="alert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>配对码是 6 位数字</span></div>
          </div>

          <div class="list">
            <div class="srow" style="align-items:flex-start">
              <input id="opt-install-apk" type="checkbox" style="width:17px;height:17px;margin-top:3px;accent-color:var(--acc);flex-shrink:0" onchange="updatePairSubmit()">
              <span class="tile-ico sm neutral"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></span>
              <label for="opt-install-apk" class="t" style="cursor:pointer">
                <b>连接后顺便安装「AndroFuse 伴侣」（可选）</b>
                <span>用于电量、通知回复与传文件；不装也能直接用 DeX 与投屏</span>
              </label>
              <button class="btn sm soft" type="button">选本地 APK…</button>
            </div>
          </div>

          <div class="dialog-foot">
            <a id="pair-submit-btn" class="btn pri" href="DesktopDevices.html" data-loading="1400">配对并连接</a>
          </div>
        </section>

        <details class="disc">
          <summary>手动输入连接地址（跨网或直连）</summary>
          <div class="disc-body" style="flex-direction:row;gap:8px">
            <input class="input" placeholder="host:port">
            <button class="btn" type="button">连接</button>
          </div>
        </details>
      </div>

      <div id="panel-comp" class="dialog-body" style="display:none">
        <div class="field-grid">
          <div class="field"><label for="comp-addr">手机地址</label><input id="comp-addr" class="input" value="192.168.1.40:27189"></div>
          <div class="field"><label for="comp-code">手机配对码</label><input id="comp-code" class="input num" inputmode="numeric" maxlength="7" placeholder="手机伴侣上显示的 6 位数字" data-validate="digits6"><span class="err" role="alert">配对码是 6 位数字</span></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <a href="MobileHome.html" style="font-size:12px;text-decoration:none">查看手机端界面 →</a>
          <a class="btn pri" href="DesktopCompanion.html" data-loading="1200">连接伴侣</a>
        </div>
      </div>
    </section>
  </div>
</div>
<script>
function switchTab(w) {
  for (const [id, on] of [['tab-phone', w === 'phone'], ['tab-comp', w === 'comp']]) {
    const t = document.getElementById(id);
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on);
  }
  document.getElementById('panel-phone').style.display = w === 'phone' ? 'flex' : 'none';
  document.getElementById('panel-comp').style.display = w === 'comp' ? 'flex' : 'none';
}
function updatePairSubmit() {
  const c = document.getElementById('opt-install-apk').checked;
  document.getElementById('pair-submit-btn').textContent = c ? '配对并安装伴侣' : '配对并连接';
}
</script>
<script src="common.js"></script>
</body>
</html>
