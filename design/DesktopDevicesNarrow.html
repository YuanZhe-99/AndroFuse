<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse · 最小桌面宽度 (820×600 自动折叠图标栏)</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="artboard">
<div class="win narrow-win rail">
  <div class="shell">
    <nav class="side" aria-label="图标栏">
      <div class="side-top">
        <a class="ib" href="DesktopDevices.html" title="展开侧边栏"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></a>
        <a class="cta-connect" href="DesktopConnectDialog.html" title="连接设备"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span>连接</span></a>
      </div>
      <a class="cmdk" href="DesktopCommandPalette.html" title="搜索或执行命令 (Ctrl K)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="lbl">搜索或执行…</span><span class="kbd"><kbd>Ctrl</kbd><kbd>K</kbd></span></a>
      <a class="nav-item cur" href="DesktopDevices.html" title="设备"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2"/></svg><span class="lbl">设备</span></a>
      <a class="nav-item" href="DesktopApps.html" title="应用"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lbl">应用</span></a>
      <a class="nav-item" href="DesktopCompanion.html" title="协同"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 7h8a4 4 0 0 1 0 8H8a4 4 0 0 1 0-8Z"/></svg><span class="lbl">协同</span></a>
      <a class="run-item" href="DesktopPaneDeX.html" title="Galaxy Z Fold 8 · 三星 DeX"><span class="tile-ico sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/></svg></span><span class="t"><b>DeX</b></span></a>
      <div style="flex:1"></div>
      <a class="nav-item" href="DesktopSettings.html" title="设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lbl">设置</span></a>
      <a class="side-status" href="DesktopDiagnostics.html" title="本机准备就绪"><span class="dot"></span><span class="t"><b>就绪</b></span></a>
    </nav>

    <div class="prow">
      <main class="pane">
        <header class="pane-head">
          <svg width="18" height="18" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="18" fill="#1D2C33"/><rect x="31.75" y="31.75" width="32.5" height="32.5" rx="5.3" fill="none" stroke="#B8F1D2" stroke-width="4"/></svg>
          <span class="ph-title"><b>设备 · 820px 最小宽度验证（图标栏自动折叠）</b></span>
          <a class="btn sm" href="DesktopDevices.html">标准宽度</a>
          <span class="vsep"></span>
          <div class="wb">
            <button aria-label="最小化"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
            <button aria-label="最大化"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
            <button class="wclose" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
          </div>
        </header>

        <div class="pane-scroll">
          <div class="pane-inner">
            <div class="ptop">
              <h1>设备</h1>
              <button class="btn" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>刷新</button>
            </div>
            <div class="list">
              <div class="lr">
                <span class="tile-ico lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="2"/></svg></span>
                <span class="t"><b>Galaxy Z Fold 8 <span class="chip ok">无线就绪</span> <span class="chip info">已记住</span></b><span>有线 + 加密无线 · 三星 DeX</span></span>
                <div class="acts">
                  <div class="split">
                    <a class="btn pri" href="DesktopPaneDeX.html">启动 DeX</a>
                    <a class="btn pri" href="DesktopOpenMenu.html"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4.5l3 3 3-3"/></svg></a>
                  </div>
                  <a class="btn" href="DesktopPaneSplit.html">镜像</a>
                  <a class="btn" href="DesktopApps.html">应用</a>
                </div>
              </div>
              <div class="lr">
                <span class="tile-ico lg neutral"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10"/></svg></span>
                <span class="t"><b>本地 Android 环境 <span class="chip ok">已就绪</span></b><span>免手机运行独立应用</span></span>
                <div class="acts"><button class="btn" type="button">启动</button></div>
              </div>
            </div>
            <div class="list">
              <div class="lr">
                <span class="tile-ico neutral"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2"/></svg></span>
                <span class="t"><b>Pixel 9a <span class="chip">离线</span></b><span>同 Wi-Fi 自动重连</span></span>
                <div class="acts">
                  <span style="font-size:12px;color:var(--tx2)">自动重连</span>
                  <button class="sw on" type="button" aria-label="自动重连"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
<script src="common.js"></script>
</body>
</html>
