<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AndroFuse · 主窗口分屏（DeX + 手机镜像 · 窄窗格自动收纳）</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="artboard">
<div class="win keep-full">
  <div class="shell">
    <nav class="side" aria-label="侧边栏">
      <div class="side-top">
        <a class="ib" href="DesktopDevicesNarrow.html" title="折叠侧边栏"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></a>
        <a class="cta-connect" href="DesktopConnectDialog.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span>连接设备</span></a>
      </div>
      <a class="cmdk" href="DesktopCommandPalette.html" title="搜索或执行命令 (Ctrl K)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="lbl">搜索或执行…</span><span class="kbd"><kbd>Ctrl</kbd><kbd>K</kbd></span></a>
      <a class="nav-item" href="DesktopDevices.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2"/></svg><span class="lbl">设备</span><span class="cnt">2</span></a>
      <a class="nav-item" href="DesktopApps.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">应用</span></a>
      <a class="nav-item" href="DesktopCompanion.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 7h8a4 4 0 0 1 0 8H8a4 4 0 0 1 0-8Z"/></svg><span class="lbl">协同</span></a>

      <div class="side-scroll">

      <div class="side-sec"><span>已打开</span><span>2</span></div>
      <a class="grp cur" href="DesktopPaneSplit.html" aria-current="page">
        <span class="gt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>DeX + 手机镜像</span>
        <span class="run-item"><span class="tile-ico sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/></svg></span><span class="t"><b>三星 DeX</b><i>运行中</i></span></span>
        <span class="run-item cur"><span class="tile-ico sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/></svg></span><span class="t"><b>手机镜像</b><i>当前焦点</i></span></span>
      </a>

      </div>
      <a class="nav-item" href="DesktopSettings.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/></svg><span class="lbl">设置</span></a>
      <a class="side-status" href="DesktopDiagnostics.html"><span class="dot"></span><span class="t"><b>本机准备就绪</b><i>硬件加速可用</i></span></a>
    </nav>

    <div class="prow">
      <!-- Left Split Pane: DeX -->
      <section class="pane" style="flex:1.15" aria-label="三星 DeX">
        <header class="pane-head">
          <span class="tile-ico sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/></svg></span>
          <span class="ph-title"><b>三星 DeX</b><i>无线 · 1920×1080 · 实测 59.8 fps</i></span>
          <button class="ib" title="最大化此窗格"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <a class="ib" href="DesktopStandalone.html" title="独立窗口打开"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-8 8"/></svg></a>
          <a class="ib" href="DesktopDevices.html" title="关闭"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6"/></svg></a>
        </header>
        <div style="flex:1;background:linear-gradient(135deg,#102127,#173831);padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:#E6EEF2">
          <div style="background:rgba(20,28,34,0.86);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px;font-size:13px">
            <b>并排多任务</b>
            <div style="color:#A6BAC4;font-size:12px;margin-top:4px">一边用三星 DeX 办公，一边操作手机镜像。</div>
          </div>
          <div style="height:34px;background:rgba(12,17,21,0.88);border-radius:9px;padding:0 12px;display:flex;align-items:center;font-size:12px;color:#CBD5E1">DeX 任务栏</div>
        </div>
      </section>

      <!-- Right Split Pane: Phone Mirror (<560px wide -> folded into ⋯) -->
      <section class="pane focus" style="flex:0.95;overflow:visible" aria-label="手机镜像">
        <header class="pane-head">
          <span class="tile-ico sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/></svg></span>
          <span class="ph-title"><b>手机镜像</b><i>有线 · 1080×2316 · 实测 60.0 fps</i></span>
          <button class="ib hv" title="更多操作" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
          <a class="ib" href="DesktopPaneDeX.html" title="关闭"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6"/></svg></a>
          <span class="vsep"></span>
          <div class="wb">
            <button aria-label="最小化"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
            <button aria-label="最大化"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
            <button class="wclose" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
          </div>
        </header>

        <!-- Open ⋯ Overflow Menu (narrow pane <560px) -->
        <div class="menu" role="menu" style="right:118px;top:40px;width:272px">
          <a class="mi" href="DesktopStandalone.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-8 8"/></svg>在独立窗口打开</a>
          <div class="mi dis" aria-disabled="true" title="半屏宽度不足 360px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>向右分屏<span class="k">空间不足</span></div>
          <div class="mi hl"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg>向下分屏<span class="k">›</span></div>
          <div class="ms"></div>
          <div class="mi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>保存 PNG 截图<span class="k kbd"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>S</kbd></span></div>
          <div class="mi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/></svg>开始录屏<span class="k kbd"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>R</kbd></span></div>
          <div class="mi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 2l20 20"/></svg>熄屏投屏</div>
        </div>

        <div class="stage">
          <div class="bezel">
            <div class="phone-scr">
              <div style="padding:18px;display:flex;justify-content:space-between;font-size:12px;color:#A6F0CE"><span>22:18</span><span>88%</span></div>
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:10px">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#5CD6A0" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/></svg>
                <b style="font-size:15px">手机屏幕实时镜像</b>
                <span style="font-size:12px;color:#94A8B3">窄窗格自动收纳标题栏操作进 ⋯</span>
              </div>
            </div>
          </div>

          <!-- Compact Icon Devbar -->
          <div class="devbar" role="toolbar" aria-label="手机快捷操作">
            <button class="ib" title="返回"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="ib" title="主页"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/></svg></button>
            <button class="ib" title="最近任务"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
            <span class="vsep"></span>
            <button class="ib" title="旋转"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg></button>
            <button class="ib" title="熄屏投屏"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.9 17.9A10.7 10.7 0 0 1 2 12c2-4.4 6.2-7 10-7 1.6 0 3.2.4 4.7 1.2M2 2l20 20"/></svg></button>
            <button class="ib" title="静音"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="common.js"></script>
</body>
</html>
