name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-windows:
    name: Core (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { os: windows-latest, arch: amd64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build prerequisites (pinned protoc, clang for ARM64 ring)
        shell: pwsh
        run: |
          go run ./tools/fetchdeps
          $clang = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\ARM64\bin\clang.exe", "C:\Program Files\LLVM\bin\clang.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($clang) { Add-Content $env:GITHUB_PATH $clang.DirectoryName }
      - name: EasyTier upstream check
        shell: pwsh
        run: |
          go run ./tools/fetchdeps -check-upstream
          if ($LASTEXITCODE -eq 2) { Write-Output "::warning::A newer EasyTier release exists; bump the embedded mesh (tools/fetchdeps -check-upstream)" }
          exit 0
      - run: cargo build --release --manifest-path core/Cargo.toml --target ${{ matrix.target }}
      - run: |
          mkdir -Force out
          Copy-Item "core/target/${{ matrix.target }}/release/androfuse_core.dll" out/androfuse_core.dll
          go run ./tools/checkpe -dir out -arch ${{ matrix.arch }}
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-windows-${{ matrix.arch }}
          path: out/androfuse_core.dll
          if-no-files-found: error

  windows:
    name: Windows packages
    needs: core-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NSIS, for the installers
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: Android build-tools for dexhelper
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-windows-amd64
          path: resources/windows-amd64/bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-windows-arm64
          path: resources/windows-arm64/bin
      - name: Build & sign packages
        env:
          CORE_PREBUILT: "1"
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          ANDROFUSE_SIGNING_KEY: ${{ secrets.ANDROFUSE_SIGNING_KEY }}
        run: bash scripts/build.sh windows/amd64 windows/arm64
      - name: Collect downloads
        run: |
          mkdir -p dist
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          for arch in amd64 arm64; do
            (cd build && zip -qr "../dist/AndroFuse-$version-windows-$arch.zip" "windows-$arch" -x '*[Ss]etup*.exe' '*.tar.gz' '*.delta' '*/update-*.json')
          done
          find build -maxdepth 2 -type f \( -iname '*setup*.exe' -o -name '*.tar.gz' -o -name '*.delta' -o -name 'update-*.json' \) -exec cp {} dist/ \;
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  android:
    name: Android package (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK & NDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" >/dev/null
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Rust core for Android (embedded EasyTier)
        run: |
          go run ./tools/fetchdeps
          bash scripts/build-android-core.sh arm64-v8a
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROFUSE_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROFUSE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROFUSE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROFUSE_ANDROID_KEY_PASSWORD }}
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          mkdir -p dist
          if [ -n "$KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_B64" | base64 --decode > "$ks"
            python3 - "$ks" "${KEY_ALIAS:-androfuse}" <<'PY'
          import json, sys
          with open("mygo.json", "r", encoding="utf-8") as f:
              cfg = json.load(f)
          cfg.setdefault("android", {})["keystore"] = sys.argv[1]
          cfg["android"]["keyAlias"] = sys.argv[2]
          with open("mygo.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
            MYGO_ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" MYGO_ANDROID_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              go tool mygo build -platform android/arm64 .
            rm -f "$ks"
            git checkout -- mygo.json
          else
            echo "No ANDROFUSE_ANDROID_KEYSTORE configured; building with debug signature."
            go tool mygo build -platform android/arm64 .
          fi
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt=$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -c -P 16 4 "build/android/androfuse-$version.apk"
          cp "build/android/androfuse-$version.apk" "dist/AndroFuse-$version-android-arm64.apk"
          ls -lh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*

  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches version
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{windows,android}"
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          for f in *\ *; do
            [ -e "$f" ] || continue
            mv "$f" "${f// /.}"
          done
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
