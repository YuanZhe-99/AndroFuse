# cargo deny --manifest-path core/Cargo.toml check licenses bans sources advisories
# Licenses, advisories, bans, and sources of the Rust core dependency graph.

[graph]
targets = [
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
]

[advisories]
version = 2
# Advisories inside the embedded EasyTier mesh (v2.7.1, rev 0d9c52b) that need dependency upgrades
# only EasyTier can make. AndroFuse follows EasyTier releases instead of patching its tree: when
# the pinned revision moves, delete this list, rerun `cargo deny ... check advisories` and re-add
# only what still applies. Any advisory not listed here still fails CI.
ignore = [
  { id = "RUSTSEC-2021-0153", reason = "encoding: unmaintained notice for encoding inside EasyTier's dependency tree" },
  { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained notice for instant inside EasyTier's dependency tree" },
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained notice for paste inside EasyTier's dependency tree" },
