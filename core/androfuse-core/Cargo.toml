[package]
name = "androfuse-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# EasyTier user-space mesh (LGPL-3.0, PLAN §9.1-1), pinned to the v2.7.1 tag commit.
# Keep it current: `go run ./tools/fetchdeps -check-upstream` reports newer EasyTier releases.
# Linked through upstream's `easytier-ffi` (kept in step with each release by EasyTier) without its
# `c-abi` feature, so only AndroFuse's own `androfuse_mesh_*` symbols are exported.
easytier-ffi = { git = "https://github.com/EasyTier/EasyTier", rev = "0d9c52b169dc2112687ddefcf571cd01d383193c", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
windows = { version = "0.58", features = [
  "Devices_Enumeration",
  "Devices_WiFiDirect",
  "Foundation",
  "Foundation_Collections",
  "Networking",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
] }
